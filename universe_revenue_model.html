**Prepared For:** University Approval Committee, Investors, & Core Leadership  
**Project:** UniVerse (Campus Digital Marketplace & Food Management Platform)  
**Objective:** A granular financial model detailing the ground-level economics for a single pilot campus. This report incorporates our **production AWS infrastructure (EC2 + RDS PostgreSQL + Vercel)** to demonstrate rock-solid profitability across both the Adoption Phase and Fully Monetized Phase.

---

## 1. Baseline Assumptions (Single Campus Pilot)
To keep all financial models grounded in reality, calculations use conservative, stable metrics for a standard university campus:

* **Daily Order Volume:** 1,000 orders / day during active campus hours.
* **Operating Days:** 25 days / month (excluding Sundays & academic holidays).
* **Monthly Order Volume:** **25,000 orders / month**.
* **Average Order Value (AOV):** ₹100 per transaction.
* **Monthly Gross Food Value (GMV):** **₹25,00,000 (₹25 Lakhs / month)**.

---

## 2. Production Cloud Infrastructure Expense (Current AWS Architecture)

| Infrastructure Component | Provider & Tier | Purpose | Monthly Cost (INR) |
| :--- | :--- | :--- | :--- |
| **Backend Compute** | AWS EC2 (\`t4g.small\` ARM64) | Node.js API, Socket.io WebSockets, PM2 & Nginx | **~₹1,150** ($13.80) |

| **TOTAL MONTHLY TECH COST** | | | **₹3,390 INR / month(approx)** |

## 3. Scenario A: Current Growth & Adoption Phase
*Goal: Rapid student adoption and frictionless vendor onboarding with zero upfront student fees.*

### Revenue Engine (Scenario A)
* **Student Convenience Fee:** **₹0** (100% Free for students).
* **Vendor Commission:** **5%** per successful order.
* **Vendor 30-Day Free Trial:** 3% platform cut waived for the first 30 days; 2% gateway cost deducted.

1. **Gross Revenue (5% Vendor Commission):** 5% of ₹25,00,000 = **₹1,25,000**

4. **Minus Operations & Support:** Ground staff, posters, support promos = **-₹20,000**

### 💰 Net Profit (Scenario A): ~₹51,610 / month
> **Strategic Takeaway:** Even with **₹0 charges to students** and covering full Razorpay gateway fees, the platform generates **~₹51,610 in clean monthly profit** from Day 1 on a single campus. The business never burns capital to acquire users.

---

*Goal: Activated once UniVerse is deeply embedded in campus culture and students are habituated to skipping physical queues.*

### Revenue Engine (Scenario B)
* **Student Convenience Fee:** Flat **₹5** added at checkout for queue-skipping privileges.
* **Vendor Commission:** Standard **5%** per transaction.
* **Featured Store Placements:** ₹1,000/month for "Top Campus Picks" & "Hero Banner" promotions (assuming 5 vendors).

### Monthly Financial Breakdown (Scenario B)
1. **Student Convenience Fees:** 25,000 orders × ₹5 = **₹1,25,000**
2. **Vendor Commission (5%):** 5% of ₹25,00,000 = **₹1,25,000**
3. **Featured Vendor Placements:** 5 vendors × ₹1,000 = **₹5,000**
* **Total Gross Monthly Revenue:** **₹2,55,000**

*Operating Expenses:*

> **Strategic Takeaway:** Adding a nominal ₹5 convenience fee that students eagerly pay to save 20 minutes standing in line increases single-campus net profit to **~₹1.79 Lakhs per month (a 3.5x increase)** with zero added server expense.

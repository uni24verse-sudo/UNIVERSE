name: Deploy UAT

on:
  push:
    branches:
      - uat
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to UAT Server
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to UAT EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.UAT_HOST }}
          username: ${{ secrets.UAT_USER }}
          key: ${{ secrets.UAT_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e
            echo "=========================================="
            echo "🚀 Deploying UniVerse UAT..."
            echo "=========================================="

            cd /home/ubuntu/UNIVERSE
            git fetch origin uat
            git reset --hard origin/uat

            echo "📦 Installing backend dependencies & generating Prisma client..."
            cd /home/ubuntu/UNIVERSE/backend
            npm install --production=false
            npx prisma generate
            
            echo "🗄️ Executing database migrations..."
            node scripts/deploy-migrations.js

            echo "🔐 Configuring SMTP credentials for 2FA mail delivery..."
            touch /home/ubuntu/UNIVERSE/backend/.env
            sed -i '/^SMTP_USER=/d' /home/ubuntu/UNIVERSE/backend/.env 2>/dev/null || true
            sed -i '/^SMTP_PASS=/d' /home/ubuntu/UNIVERSE/backend/.env 2>/dev/null || true
            sed -i '/^SMTP_HOST=/d' /home/ubuntu/UNIVERSE/backend/.env 2>/dev/null || true
            sed -i '/^SMTP_PORT=/d' /home/ubuntu/UNIVERSE/backend/.env 2>/dev/null || true
            echo "SMTP_HOST=smtp.gmail.com" >> /home/ubuntu/UNIVERSE/backend/.env
            echo "SMTP_PORT=587" >> /home/ubuntu/UNIVERSE/backend/.env
            echo "SMTP_USER=parthsharma240404@gmail.com" >> /home/ubuntu/UNIVERSE/backend/.env
            echo "SMTP_PASS=kvoeeuighrczbanv" >> /home/ubuntu/UNIVERSE/backend/.env
            sed -i '/^FRONTEND_URL=/d' /home/ubuntu/UNIVERSE/backend/.env 2>/dev/null || true
            sed -i '/^APP_ENV=/d' /home/ubuntu/UNIVERSE/backend/.env 2>/dev/null || true
            echo "FRONTEND_URL=https://uat.food.universeorder.co.in" >> /home/ubuntu/UNIVERSE/backend/.env
            echo "APP_ENV=uat" >> /home/ubuntu/UNIVERSE/backend/.env

            echo "🎨 Building frontend for UAT..."
            cd /home/ubuntu/UNIVERSE/frontend
            npm install
            VITE_API_URL="https://uat.food.universeorder.co.in" npm run build

            echo "🔄 Reloading PM2 backend service..."
            pm2 reload universe-backend || pm2 restart universe-backend || pm2 restart all
            pm2 logs universe-backend --lines 25 --nostream

            echo "🌐 Inspecting, updating and reloading active Nginx configuration..."
            sudo python3 /home/ubuntu/UNIVERSE/backend/scripts/update-nginx.py

            echo "=========================================="
            echo "✅ UniVerse UAT Deployment Completed!"
            echo "🌐 URL: https://uat.food.universeorder.co.in"
            echo "=========================================="
